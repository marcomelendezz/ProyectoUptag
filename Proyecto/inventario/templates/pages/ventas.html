{% extends "base.html" %}
{% load static%}
{% block title %}Ventas{% endblock %}
{% block css %}
<link rel="stylesheet" href="{% static 'css/dataTables.bootstrap4.min.css' %}">
<link rel="stylesheet" href="{% static 'plugins/owlcarousel/owl.carousel.min.css' %}">
<link rel="stylesheet" href="{% static 'plugins/owlcarousel/owl.theme.default.min.css' %}">
<link rel="stylesheet" href="{% static 'css/bootstrap-datetimepicker.min.css' %}">
{% endblock %}

{% block content %}
<h1>Ventas</h1>

<!-- Datos del cliente -->


<form id="form-cliente" class="d-flex flex-wrap align-items-end gap-2 mb-3"
	style="background:#f8f9fa;padding:10px;border-radius:8px;">
	{% csrf_token %}
	<div class="form-group mb-0">
		<label for="dni" class="form-label mb-0">DNI</label>
		<input type="text" id="dni" name="dni" class="form-control form-control-sm" style="width:120px;" required>
	</div>
	<div class="form-group mb-0">
		<label for="nombre" class="form-label mb-0">Nombre</label>
		<input type="text" id="nombre" name="nombre" class="form-control form-control-sm" style="width:120px;" required>
	</div>
	<div class="form-group mb-0">
		<label for="email" class="form-label mb-0">Email</label>
		<input type="text" id="email" name="email" class="form-control form-control-sm" style="width:120px;">
	</div>
	<div class="form-group mb-0">
		<label for="telefono" class="form-label mb-0">Teléfono</label>
		<input type="text" id="telefono" name="telefono" class="form-control form-control-sm" style="width:100px;">
	</div>
	<div class="form-group mb-0">
		<label for="direccion" class="form-label mb-0">Dirección</label>
		<input type="text" id="direccion" name="direccion" class="form-control form-control-sm" style="width:140px;">
	</div>
</form>


<div class="page-wrapper ms-0">
	<div class="row">
		<div class="col-lg-5 col-sm-12">
			<div class="card">
				<div class="card-body">
					<!-- Selector de servicio -->
					<div class="mb-3">
						<label for="servicio-select" class="form-label">Servicio</label>
						<select id="servicio-select" class="form-select">
							<option value="">Selecciona un servicio</option>
							{% for servicio in servicios %}
							<option value="{{ servicio.id }}" data-precio="{{ servicio.precio }}">{{ servicio.nombre }}
							</option>
							{% endfor %}
						</select>
					</div>
					<!-- Selector de producto y cantidad -->
					<div class="row mb-3">
						<div class="col-8">
							<label for="producto-select" class="form-label">Producto (Opcional)</label>
							<select id="producto-select" class="form-select">
								<option value="">Selecciona un producto</option>
								{% for producto in productos %}
								<option value="{{ producto.id }}" data-precio="{{ producto.precio_venta }}"
									data-nombre="{{ producto.nombre }}">
									{{ producto.nombre }}
								</option>
								{% endfor %}
							</select>
						</div>
						<div class="col-4">
							<label for="cantidad-input" class="form-label">Cant.</label>
							<input type="number" id="cantidad-input" class="form-control" min="1">
						</div>
					</div>
					<div class="d-grid">
						<button type="button" id="agregar-lista" class="btn btn-success btn-block">Agregar a la
							lista</button>
					</div>
				</div>
			</div>
		</div>

		<div class="col-lg-7 col-sm-12">
			<div class="card pos-card">
				<div class="card-header pos-header">
					<h5 class="mb-0">Lista de Venta</h5>
				</div>
				<div class="card-body pt-3 pb-2">
					<!-- Tabla de lista de compra -->
					<div class="mb-3">
						<div class="table-responsive">
							<table class="table table-bordered" id="tabla-lista-compra">
								<thead>
									<tr>
										<th>Servicio</th>
										<th>Producto</th>
										<th style="width: 70px;">Cant.</th>
										<th>Precio</th>
										<th style="width: 50px;"></th>
									</tr>
								</thead>
								<tbody>
									<!-- Items agregados dinámicamente -->
								</tbody>
							</table>
						</div>
					</div>
					<div class="row align-items-center">
						<div class="col-6">
							<strong>Total: <span id="total-pagar-ves">0.00 VES</span></strong>
							<div class="text-muted small" id="total-pagar-usd">($0.00 USD)</div>
						</div>
						<div class="col-6 text-end">
							<div class="setvaluecash mb-2">
								<select id="metodo-pago" class="form-select form-select-sm">
									<option value="efectivo">Efectivo</option>
									<option value="debito">Débito</option>
									<option value="pago_movil">Pago Móvil</option>
								</select>
							</div>
							<button type="button" id="btn-checkout" class="btn btn-primary btn-sm w-100">
								<b>Procesar Venta</b>
							</button>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/jquery.dataTables.min.js' %}"></script>
<script src="{% static 'js/dataTables.bootstrap4.min.js' %}"></script>

<script src="{% static 'js/ventas.js' %}"></script>
<script src="{% static 'js/currency_converter.js' %}"></script>
<script>
	// --- Autocompletar cliente por DNI ---
	document.getElementById('dni').addEventListener('blur', function () {
		const dni = this.value.trim();
		if (dni.length > 0) {
			fetch(`/buscar_cliente/?dni=${dni}`)
				.then(response => response.json())
				.then(data => {
					if (data.encontrado) {
						document.getElementById('nombre').value = data.nombre;
						document.getElementById('email').value = data.email;
						document.getElementById('telefono').value = data.telefono;
						document.getElementById('direccion').value = data.direccion;
					} else {
						document.getElementById('nombre').value = '';
						document.getElementById('email').value = '';
						document.getElementById('telefono').value = '';
						document.getElementById('direccion').value = '';
						// alert('Cliente no registrado. Por favor, ingresa los datos para agregarlo.');
					}
				})
				.catch(() => {
					console.error('Error al buscar el cliente.');
				});
		}
	});

	// --- Cargar productos al seleccionar servicio ---
	document.getElementById('servicio-select').addEventListener('change', function () {
		const servicioId = this.value;
		const productoSelect = document.getElementById('producto-select');
		productoSelect.innerHTML = '<option value="">Selecciona un producto</option>';

		if (servicioId) {
			fetch(`/get_productos_servicio/${servicioId}/`)
				.then(response => response.json())
				.then(data => {
					let defaultProductId = null;
					data.productos.forEach(prod => {
						const option = document.createElement('option');
						option.value = prod.id;
						option.text = prod.nombre; // Limpiado el precio del texto
						option.dataset.precio = prod.precio;
						option.dataset.nombre = prod.nombre;
						if (prod.predeterminado) {
							defaultProductId = prod.id;
						}
						productoSelect.appendChild(option);
					});

					if (defaultProductId) {
						productoSelect.value = defaultProductId;
					}
				});
		}
	});

	// --- Manejo de la lista de compra ---
	window.listaCompra = [];

	function safeParseFloat(val) {
		const parsed = parseFloat(val);
		return isNaN(parsed) ? 0 : parsed;
	}

	document.getElementById('agregar-lista').addEventListener('click', function () {
		const servicioSelect = document.getElementById('servicio-select');
		const productoSelect = document.getElementById('producto-select');
		const cantidadInput = document.getElementById('cantidad-input');

		const servicioId = servicioSelect.value;
		if (!servicioId) {
			Swal.fire('Error', 'Selecciona al menos un servicio.', 'error');
			return;
		}

		const selectedServicio = servicioSelect.options[servicioSelect.selectedIndex];
		const servicioNombre = selectedServicio.text;
		const servicioPrecio = safeParseFloat(selectedServicio.dataset.precio);

		const productoId = productoSelect.value;
		let productoNombre = 'N/A';
		let productoPrecio = 0;

		if (productoId && productoSelect.selectedIndex >= 0) {
			const selectedProducto = productoSelect.options[productoSelect.selectedIndex];
			productoNombre = selectedProducto.dataset.nombre || 'N/A';
			productoPrecio = safeParseFloat(selectedProducto.dataset.precio);
		}

		const cantidad = parseInt(cantidadInput.value) || 1;

		// Lógica de precio: Si el servicio tiene precio (> 0), se cobra solo el precio del servicio.
		// Si el servicio no tiene precio (0), se cobra el precio del producto.
		let precioUnitario = 0;
		if (servicioPrecio > 0) {
			precioUnitario = servicioPrecio;
		} else {
			precioUnitario = productoPrecio;
		}

		const precioFinal = precioUnitario * cantidad;

		const item = {
			servicio_id: servicioId,
			servicio_nombre: servicioNombre,
			producto_id: productoId || null,
			producto_nombre: productoNombre,
			cantidad: cantidad,
			precio: precioFinal
		};

		window.listaCompra.push(item);
		actualizarTabla();

		// Reset cantidad to 1
		cantidadInput.value = 1;
	});

	async function actualizarTabla() {
		const tbody = document.querySelector('#tabla-lista-compra tbody');
		tbody.innerHTML = '';
		let total = 0;

		window.listaCompra.forEach((item, index) => {
			total += item.precio;
			const row = `
				<tr>
					<td>${item.servicio_nombre}</td>
					<td>${item.producto_nombre}</td>
					<td class="text-center">${item.cantidad}</td>
					<td class="text-end">${item.precio.toFixed(2)}</td>
					<td class="text-center">
                        <button class="btn btn-sm" onclick="quitarItem(${index})">
                            <img src="/static/img/icons/delete.svg" width="15" alt="img">
                        </button>
                    </td>
				</tr>
			`;
			tbody.innerHTML += row;
		});

		document.getElementById('total-pagar-ves').innerText = total.toFixed(2) + ' VES';

		// Actualización en tiempo real de BCV
		const rate = await CurrencyConverter.getExchangeRate();
		if (rate && rate > 0) {
			const totalUsd = total / rate;
			const totalUsdFormatted = CurrencyConverter.formatCurrency(totalUsd, 'USD');
			document.getElementById('total-pagar-usd').innerText = `(${totalUsdFormatted} USD)`;
			document.getElementById('total-pagar-usd-badge').innerText = `(${totalUsdFormatted} USD)`;
		}

		// Actualizar el total en el badge del checkout
		document.getElementById('total-pagar-ves-badge').innerText = total.toFixed(2) + ' VES';
	}

	window.quitarItem = function (index) {
		window.listaCompra.splice(index, 1);
		actualizarTabla();
	}

	// --- Checkout: enviar venta al backend ---
	document.getElementById('btn-checkout').addEventListener('click', function () {
		// Obtener datos del cliente
		const cliente = {
			dni: document.getElementById('dni').value.trim(),
			nombre: document.getElementById('nombre').value.trim(),
			email: document.getElementById('email').value.trim(),
			telefono: document.getElementById('telefono').value.trim(),
			direccion: document.getElementById('direccion').value.trim()
		};
		// Obtener método de pago
		const metodo_pago = document.getElementById('metodo-pago').value;
		// Obtener lista de compra
		if (!window.listaCompra || window.listaCompra.length === 0) {
			alert('Agrega al menos un producto o servicio a la lista.');
			return;
		}
		// Validar cliente
		if (!cliente.dni || !cliente.nombre) {
			alert('Completa los datos del cliente (DNI y Nombre son obligatorios).');
			return;
		}
		// Enviar datos al backend
		fetch('/registrar_venta/', {
			method: 'POST',
			headers: {
				'Content-Type': 'application/json',
				'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
			},
			body: JSON.stringify({
				cliente: cliente,
				metodo_pago: metodo_pago,
				items: window.listaCompra
			})
		})
			.then(response => response.json())
			.then(data => {
				if (data.success) {
					alert('Venta registrada correctamente.');
					window.location.reload();
				} else {
					alert('Error al registrar la venta: ' + (data.error || ''));
				}
			})
			.catch(err => {
				console.error(err);
				alert('Error de conexión al registrar la venta.');
			});
	});
</script>
{% endblock %}
